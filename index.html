<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>relicstars</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--cream:#F0E9D9;--card:rgba(244,237,222,.93);--red:#BB1022;--star:#AC494B;--blue:#5F86A2;--ink:#2b2320}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--cream)}
body{margin:0;background:transparent;color:var(--ink);font-family:Nunito,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--cream) url(img/bg.jpg) center/cover no-repeat}
body{padding:0 16px 110px}
header{padding:26px 0 6px;text-align:center}
.logo{display:block;margin:0 auto;width:74%;max-width:300px;height:auto}
.tag{display:inline-block;font-size:13px;margin-top:8px;font-weight:700;background:var(--card);padding:4px 12px;border-radius:999px}
.card{background:var(--card);border:2px solid var(--blue);border-radius:20px;padding:14px;margin:16px 0}
.pic{border-radius:14px;overflow:hidden;background:#F7EDDF}
.pic img{display:block;width:100%;height:auto}
h2{margin:12px 0 2px;font-size:22px;font-weight:900;color:var(--red)}
.price{font-weight:900;font-size:20px;margin:4px 0 8px}
.small{font-size:13px;opacity:.75;margin-bottom:4px}
.sizes{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.sz{min-width:52px;padding:9px 0;text-align:center;border:2px solid var(--blue);border-radius:999px;font-weight:700;background:transparent;color:var(--ink);font-family:inherit;font-size:15px}
.sz.on{background:var(--blue);color:#fff}
.sz:disabled{opacity:.3;text-decoration:line-through}
.btn{width:100%;border:0;border-radius:999px;padding:14px;background:var(--red);color:#fff;font:900 16px Nunito,sans-serif}
.btn:disabled{opacity:.35}
.btn.ghost{background:transparent;color:var(--red);border:2px solid var(--red)}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(240,233,217,.96) 35%)}
.hide{display:none}
.panel{background:var(--card);border-radius:20px;padding:6px 16px 16px;margin-top:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--blue)}
.row b{font-weight:900}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:30px;height:30px;border-radius:50%;border:2px solid var(--blue);background:transparent;font:900 16px Nunito;color:var(--ink)}
label{display:block;font-weight:700;font-size:13px;margin:14px 0 4px}
input,select,textarea{width:100%;padding:12px 14px;border:2px solid var(--blue);border-radius:14px;background:#fff9;font:500 16px Nunito,sans-serif;color:var(--ink)}
.row2{display:flex;justify-content:space-between;font-weight:700;margin:8px 0}
.total{display:flex;justify-content:space-between;font-weight:900;font-size:18px;margin:14px 0 4px}
.back{background:var(--card);border:0;border-radius:999px;color:var(--blue);font:700 15px Nunito;padding:8px 14px;margin:14px 0 8px}
.note{font-size:13px;line-height:1.35;margin-top:14px;opacity:.85}
.err{color:var(--red);font-size:13px;margin-top:8px;min-height:16px;font-weight:700}
.empty{text-align:center;opacity:.6;padding:30px 0}
.agree{display:flex;align-items:flex-start;gap:10px;font-size:14px;font-weight:700;margin:16px 0 4px;line-height:1.35}
.agree input{width:24px;height:24px;padding:0;flex:none;margin:0;accent-color:var(--red)}
a{color:var(--blue);font-weight:700}
#docView{position:fixed;inset:0;z-index:50;background:var(--cream);display:flex;flex-direction:column}
#docView.hide{display:none}
#docView .top{padding:8px 16px}
#docView iframe{flex:1;border:0;width:100%}
.done{text-align:center;padding-top:70px}
.done .panel{padding:30px 20px;background:rgba(244,237,222,.98);border:2px solid var(--blue)}
.done .star{color:var(--star);font-size:36px;line-height:1}
.done p{margin:8px 0;font-weight:700}
.code{font-weight:900;font-size:30px;color:var(--red);letter-spacing:1px;margin:6px 0 16px}
</style>
</head>
<body>

<section id="catalog">
  <header>
    <img class="logo" src="img/logo.png" alt="relicstars">
    <div class="tag">Локальный ювелирный бренд</div>
  </header>
  <div id="list"></div>
</section>

<section id="checkout" class="hide">
  <button class="back" id="backBtn">← к каталогу</button>
  <div class="panel">
    <h2 style="font-size:24px">Ваш заказ</h2>
    <div id="cartList"></div>
    <div class="row2"><span>Товары</span><span id="sumItems"></span></div>
    <div class="row2"><span id="delLabel">Доставка</span><span id="delPrice"></span></div>
    <div class="total"><span>Итого</span><span id="sum"></span></div>

    <label for="fName">Как вас зовут</label>
    <input id="fName" autocomplete="name">
    <label for="fTg">Ваш ник в Telegram</label>
    <input id="fTg" autocomplete="off" autocapitalize="off" placeholder="@username">
    <label for="fEmail">Почта (по желанию)</label>
    <input id="fEmail" type="email" autocomplete="email" placeholder="name@mail.com">
    <label for="fDel" id="lDel">Получение</label>
    <select id="fDel"></select>
    <div id="addrBox" class="hide">
      <label for="fAddr">Адрес или пункт выдачи</label>
      <textarea id="fAddr" rows="2"></textarea>
    </div>
    <div class="note" id="delNote"></div>
    <label class="agree"><input type="checkbox" id="fConsent"><span>Даю согласие на обработку персональных данных на условиях <a href="#" data-doc="consent.html">Согласия</a></span></label>
    <div class="small" style="margin-top:6px">Как мы используем данные: <a href="#" data-doc="privacy.html">Политика обработки персональных данных</a></div>
    <div class="err" id="err"></div>
  </div>
</section>

<section id="done" class="hide done">
  <div class="panel">
    <div class="star">✦</div>
    <h2 style="font-size:26px">Заказ оформлен</h2>
    <p>Осталось нажать «Отправить» в открывшемся чате — так заказ дойдёт до нас.</p>
    <p>С вами скоро свяжутся.</p>
    <button class="btn ghost" id="reopen" style="margin-top:14px">Открыть чат ещё раз</button>
  </div>
</section>

<div id="docView" class="hide"><div class="top"><button class="back" id="docClose" style="margin:6px 0">← Назад к заказу</button></div><iframe id="docFrame" title="Документ"></iframe></div>

<div class="bar" id="bar"><button class="btn" id="mainBtn" disabled></button></div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString('ru-RU').replace(/ /g,' ') + ' ₽';

let ORDER_TO = '', lastText = '';
let CAT = null, stock = {}, cart = [], pick = {}, screen = 'catalog';

const prod = id => CAT.products.find(p => p.id === id);
const inCart = (id,size) => (cart.find(i => i.id===id && i.size===size)||{qty:0}).qty;
const avail = (id,size) => Math.max(0, ((stock[id]||{})[size]||0) - inCart(id,size));
const cartCount = () => cart.reduce((a,i)=>a+i.qty,0);
const cartSum = () => cart.reduce((a,i)=>a+i.qty*prod(i.id).price,0);
const curDel = () => CAT.delivery.find(x=>x.id===$('fDel').value) || CAT.delivery[0];
const delPrice = () => (curDel().price||0);
const orderTotal = () => cartSum() + delPrice();

function renderCatalog(){
  $('list').innerHTML = CAT.products.map(p => {
    const sizes = Object.keys(p.stock).map(sz =>
      `<button class="sz ${pick[p.id]===sz?'on':''}" data-p="${p.id}" data-s="${sz}" ${avail(p.id,sz)?'':'disabled'}>${sz}</button>`).join('');
    return `<div class="card"><div class="pic"><img src="${p.image}" alt="${p.name}"></div>
      <h2>${p.name}</h2>
      <div class="price">${fmt(p.price)}</div>
      <div class="small">Размер</div>
      <div class="sizes">${sizes}</div>
      <button class="btn ghost add" data-p="${p.id}" ${pick[p.id]?'':'disabled'}>Добавить в корзину</button></div>`;
  }).join('');
}
function renderCart(){
  if(!cart.length){ $('cartList').innerHTML='<div class="empty">Корзина пуста</div>'; }
  else $('cartList').innerHTML = cart.map((i,ix)=>{const p=prod(i.id);
    return `<div class="row"><div><b>${p.name}</b><div class="small" style="margin:0">размер ${i.size} · ${fmt(p.price)}</div></div>
    <div class="qty"><button data-d="-1" data-i="${ix}">−</button><b>${i.qty}</b><button data-d="1" data-i="${ix}">+</button></div></div>`}).join('');
  $('sumItems').textContent = fmt(cartSum());
  $('delLabel').textContent = delPrice() ? 'Доставка · ' + curDel().label : 'Получение';
  $('delPrice').textContent = delPrice() ? fmt(delPrice()) : 'бесплатно';
  $('sum').textContent = fmt(orderTotal());
}
function updateBar(){
  const b = $('mainBtn');
  b.disabled = !cartCount();
  if(screen==='catalog') b.textContent = cartCount() ? `Корзина · ${cartCount()} шт · ${fmt(cartSum())}` : 'Выберите кольцо и размер';
  else b.textContent = `Оформить заказ · ${fmt(orderTotal())}`;
}
function go(s){
  screen = s;
  $('catalog').classList.toggle('hide', s!=='catalog');
  $('checkout').classList.toggle('hide', s!=='checkout');
  $('done').classList.toggle('hide', s!=='done');
  $('bar').classList.toggle('hide', s==='done');
  if(s==='checkout') renderCart(); else if(s==='catalog') renderCatalog();
  updateBar(); window.scrollTo(0,0);
}

$('list').addEventListener('click', e => {
  const t = e.target;
  if(t.classList.contains('sz')){ pick[t.dataset.p] = t.dataset.s; renderCatalog(); }
  if(t.classList.contains('add')){
    const id=t.dataset.p, size=pick[id];
    if(!size || !avail(id,size)) return;
    const ex = cart.find(i=>i.id===id&&i.size===size);
    ex ? ex.qty++ : cart.push({id,size,qty:1});
    pick[id]=null; renderCatalog(); updateBar();
    tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success');
  }
});
$('cartList').addEventListener('click', e => {
  const t=e.target; if(!t.dataset.i) return;
  const it=cart[+t.dataset.i], d=+t.dataset.d;
  if(d>0){ if(avail(it.id,it.size)<1) return; it.qty++; }
  else { it.qty--; if(it.qty<1) cart.splice(+t.dataset.i,1); }
  if(!cart.length){ go('catalog'); return; }
  renderCart(); updateBar();
});
$('backBtn').onclick = () => go('catalog');
$('fDel').onchange = () => { syncDelivery(); renderCart(); updateBar(); };
function syncDelivery(){
  const d = CAT.delivery.find(x=>x.id===$('fDel').value);
  $('addrBox').classList.toggle('hide', !(d && d.needs_address));
}

$('mainBtn').onclick = () => {
  if(screen==='catalog'){ go('checkout'); return; }
  const name=$('fName').value.trim(), addr=$('fAddr').value.trim(), email=$('fEmail').value.trim();
  const nick=$('fTg').value.trim().replace(/^https?:\/\/t\.me\//i,'').replace(/^@/,'');
  const d=CAT.delivery.find(x=>x.id===$('fDel').value);
  if(!name) return $('err').textContent='Укажите имя';
  if(!/^[A-Za-z0-9_]{5,32}$/.test(nick)) return $('err').textContent='Укажите ник в Telegram, например @username';
  if(email && !/^\S+@\S+\.\S+$/.test(email)) return $('err').textContent='Проверьте почту или оставьте поле пустым';
  if(d.needs_address && !addr) return $('err').textContent='Укажите адрес или пункт выдачи';
  if(!$('fConsent').checked) return $('err').textContent='Поставьте галочку согласия на обработку персональных данных';
  $('err').textContent='';
  const lines = cart.map(i=>`• ${prod(i.id).name}, размер ${i.size} × ${i.qty} — ${fmt(prod(i.id).price*i.qty)}`);
  lastText = ['Заказ с витрины relicstars ✦', ...lines, (d.price ? `Доставка (${d.label}): ${fmt(d.price)}` : `Получение: ${d.label}`), `Итого: ${fmt(cartSum()+(d.price||0))}`, '',
    `Имя: ${name}`, `Telegram: @${nick}`, email ? `Почта: ${email}` : null,
    d.needs_address ? `Адрес или пункт выдачи: ${addr}` : null,
    '', `Согласие на обработку персональных данных: дано, ${new Date().toLocaleString('ru-RU',{timeZone:'Europe/Moscow',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})} (МСК), редакция от 16.11.2026`].filter(x=>x!==null).join('\n');
  go('done');
  $('reopen').classList.toggle('hide', !ORDER_TO);
  if(tg) openChat();
};
function openChat(){
  if(!ORDER_TO) return;
  const url = 'https://t.me/' + ORDER_TO + '?text=' + encodeURIComponent(lastText);
  if(tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url,'_blank');
}
$('reopen').onclick = openChat;
function openDoc(file){
  const f=$('docFrame');
  if(window.DOCS) f.srcdoc=window.DOCS[file]; else f.src=file;
  $('docView').classList.remove('hide');
}
document.addEventListener('click', e => {
  const a = e.target.closest('[data-doc]'); if(!a) return;
  e.preventDefault(); openDoc(a.dataset.doc);
});
$('docClose').onclick = () => { $('docView').classList.add('hide'); $('docFrame').removeAttribute('src'); };

(async function init(){
  CAT = await (await fetch('catalog.json?'+Date.now())).json();
  ORDER_TO = (CAT.order_to||'').replace(/^@/,'');
  CAT.products.forEach(p => stock[p.id] = Object.assign({}, p.stock));
  try {  // актуальные остатки приходят от бота в адресе
    const s = new URLSearchParams(location.search).get('s');
    if(s) stock = JSON.parse(s);
  } catch(e){}
  CAT.products.forEach(p => { if(!stock[p.id]) stock[p.id]={}; });
  $('delNote').textContent = CAT.delivery_note || ''; $('delNote').classList.toggle('hide', !CAT.delivery_note);
  $('fDel').innerHTML = CAT.delivery.map(d=>`<option value="${d.id}">${d.label}${d.price ? ' — ' + fmt(d.price) : ' — бесплатно'}</option>`).join('');
  const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
  if(u){ $('fName').value = [u.first_name,u.last_name].filter(Boolean).join(' '); if(u.username) $('fTg').value='@'+u.username; }
  if(CAT.delivery.length===1){ $('lDel').classList.add('hide'); $('fDel').classList.add('hide'); }
  syncDelivery(); go('catalog');
})();
</script>
</body>
</html>
